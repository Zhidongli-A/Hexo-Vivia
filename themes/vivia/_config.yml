# 导航栏
menu:                      # 导航栏上的链接
  主页: /
  归档: /archives
  聊天: /chat
  友链: /links
  状态: /status
  关于: /about
rss: false
umami_stats_url: https://cloud.umami.is/share/IbtRxAKWUAPTHoEr

home:
  style: default           # default, detail

favicon:                 # Favicon 文件路径，相对于 /source 目录（若你的 Favicon 文件位于 /source/favicon.png 则填写 "/favicon.png"）

# 横幅图片
banner:
  enable: false                  # 是否显示横幅图片
  url:                      # 横幅图片文件路径，相对于 /source 目录，也可填写网络图片 URL
  position: center               # 决定图片将如何被裁剪，对应 CSS 中的 "object-position" 属性
  onAllPages: true               # 在所有页面上显示横幅，而不是只在首页显示

# 外观
hue: 250                         # 主题色调 (例如：红: 0，橙: 60，蓝：260，紫：300，粉：345)

# 个人信息
avatar: /Photo.jpg
author: 枝动力
subtitle: 终究无意义。

# 加载页
loading:
  title: 枝动力の小站
  subtitle: 少女祈祷中~
links:
  - name: Bilibili
    icon: fa-brands fa-bilibili
    url: https://space.bilibili.com/3546388008798309
  - name:   QQ
    icon: fa-brands fa-qq
    url: tencent://message/?uin=3305162655
  - name: GitHub
    icon: fa-brands fa-github
    url: https://github.com/Zhidongli-A
  - name: Email
    icon: fa-regular fa-envelope
    url: mailto:contact@mail.zhidongli.top

# 侧边栏
sidebar:
  widgets:                 # 需要启用的组件 (profile, category, tag, archive, recent_posts)
    normal:                # 随页面滚动的组件
      - profile
    sticky:                 # 固定在页面顶部的组件
      - category
      - tag

# 侧边栏组件设置
archive_type: 'monthly'
recent_posts_limits: 5
categories:
  max_depth:           # 分类组件中显示的最大目录深度 (留空为不限制)

# 第三方评论系统
comment:
  valine:
    enable: false
    appId:
    appKey:
    placeholder: Just go go
    pageSize: 10
    highlight: true
    serverURLs:
  twikoo:
    enable: false
    envID:
    region:
    path: location.pathname
    lang:
  waline:
    enable: false
    serverURL:
  giscus:
    enable: true
    repo: Zhidongli-A/Hexo-Vivia
    repo_id: R_kgDORsIu_w
    category: Announcements
    category_id: DIC_kwDORsIu_84C9q_D
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: top
    lang: zh-CN
    loading: lazy

#Analytics
gauges_analytics: false
google_analytics: false
baidu_analytics: false

archive_generator:
  per_page: 0

# Sakana Widget（右下角挂件）
sakana:
  enable: true                  # 是否启用
  character: chisato            # 默认角色：chisato / takina
  controls: true                # 是否显示控制条（切换角色、自动模式、GitHub、关闭）
  rod: true                     # 是否显示弹簧杆
  draggable: true               # 是否可拖拽

# AI 聊天
chat:
  enable: true                  # 是否启用 AI 聊天面板
  apiUrl: https://easymodelapi.zhidongli.top/v1/chat/completions
  # OpenAI Chat Completions 兼容，body: { messages: [...] }
